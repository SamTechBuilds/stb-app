# Builds the signed, release-ready STB App APK from the same code as the STB Website.
# Run it from GitHub: Actions -> "Android release APK" -> Run workflow (or push a tag like v0.2.0).
#
# Repository VARIABLES (Settings -> Secrets and variables -> Actions -> Variables):
#   VITE_SUPABASE_URL, VITE_SUPABASE_ANON_KEY, VITE_DELIVERY_SITE_URL, VITE_APP_WEB_URL
# Repository SECRETS:
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# See docs/ANDROID.md.
name: Android release APK
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name shown to users, e.g. 0.2.0"
        required: true
        default: "0.1.0"
  push:
    tags: ["v*"]

permissions:
  contents: write # only used to attach the APK to a GitHub Release when a tag is pushed

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      VITE_DELIVERY_SITE_URL: ${{ vars.VITE_DELIVERY_SITE_URL }}
      VITE_APP_WEB_URL: ${{ vars.VITE_APP_WEB_URL }}
      STB_VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
      STB_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          for v in VITE_SUPABASE_URL VITE_SUPABASE_ANON_KEY VITE_DELIVERY_SITE_URL VITE_APP_WEB_URL; do
            [ -n "${!v}" ] || missing="$missing variable:$v"
          done
          [ -n "$KS" ] || missing="$missing secret:ANDROID_KEYSTORE_BASE64"
          [ -n "$KSP" ] || missing="$missing secret:ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KA" ] || missing="$missing secret:ANDROID_KEY_ALIAS"
          [ -n "$KP" ] || missing="$missing secret:ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing:$missing (see docs/ANDROID.md)"; exit 1; fi
          case "$VITE_SUPABASE_URL" in https://*.supabase.co) ;; *) echo "::error::VITE_SUPABASE_URL must look like https://<ref>.supabase.co"; exit 1;; esac
          STB_VERSION_NAME="${STB_VERSION_NAME#v}"
          echo "STB_VERSION_NAME=$STB_VERSION_NAME" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - uses: android-actions/setup-android@v3

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build the app's web layer and copy it into the Android project
        run: npx vite build && npx cap sync android

      - name: Restore the signing key (temporary file, deleted at the end)
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/stb-release.jks"
          echo "STB_KEYSTORE_PATH=$RUNNER_TEMP/stb-release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        working-directory: android
        env:
          STB_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          STB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify signature and name the file
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee apksigner.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" apksigner.txt
          mkdir out
          cp "$APK" "out/stb-app-${STB_VERSION_NAME}-${STB_VERSION_CODE}.apk"
          (cd out && sha256sum *.apk > SHA256SUMS.txt)
          grep "Signer #1 certificate SHA-256" apksigner.txt >> out/SHA256SUMS.txt || true

      - name: Remove the signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stb-release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: stb-app-apk-${{ env.STB_VERSION_NAME }}-${{ env.STB_VERSION_CODE }}
          path: out/*
          retention-days: 30

      - name: Attach to a GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
